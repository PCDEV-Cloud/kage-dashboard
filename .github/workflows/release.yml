name: Release

# Wydanie: podnieś wersję w package.json, potem na GitHubie Releases → Draft a new release,
# tag vX.Y.Z → Publish. Ten workflow zbuduje kage.js i dołączy go do wydania (HACS pobiera ten plik).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Attach kage.js to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/kage.js --clobber
